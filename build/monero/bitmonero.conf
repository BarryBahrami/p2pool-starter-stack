# --- DATA PATHS ---
# These paths are INTERNAL to the container
data-dir=/root/.bitmonero
log-file=/root/.bitmonero/bitmonero.log
log-level=4

# --- NETWORK SETTINGS ---
# We bind to 0.0.0.0 so P2Pool and Tari can talk to Monerod
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
rpc-bind-ip=0.0.0.0
rpc-bind-port=18081
confirm-external-bind=1
public-node=1

# --- P2POOL / ZMQ ---
# This is critical for P2Pool to see new blocks
zmq-pub=tcp://0.0.0.0:18083
out-peers=64
in-peers=64
add-priority-node=p2pmd.xmrvsbeast.com:18080
add-priority-node=nodes.hashvault.pro:18080
add-priority-node=node.sethforprivacy.com:443
add-priority-node=xmr-node.cakewallet.com:18081
enforce-dns-checkpointing=true
enable-dns-blocklist=true


# --- SECURITY ---
restricted-rpc=1
rpc-login=moneronode:686c2hG58btbXBsGUF
no-igd=1

# --- TOR SETTINGS ---
# Use the 'tor' service name defined in docker-compose
#proxy=172.28.0.25:9050
tx-proxy=tor,172.28.0.25:9050,disable_noise

anonymous-inbound=3pcmi2btwawepesue23yhdyuarjrezhclh4yfdrtfrzrxvwvhb6gwpad.onion:18080,127.0.0.1:18084
